<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Challenge Generator</title>

<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 700px;
  margin: 60px auto;
  padding: 24px;
  text-align: center;
  color: #111;
}

h1 {
  margin-bottom: 12px;
}

.subtitle {
  color: #666;
  margin-bottom: 40px;
}

.challenge {
  font-size: 28px;
  line-height: 1.4;
  margin: 40px 0;
  padding: 24px;
  border-radius: 16px;
  background: #f5f5f5;
}

button {
  font-size: 18px;
  padding: 16px 28px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #111;
  color: white;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<h1>Your Codex Challenge</h1>

<p class="subtitle">
Scan. Get an idea. Build instantly with Codex.
</p>

<div id="challenge" class="challenge"></div>

<button id="openCodex">
Build with Codex
</button>

<script>

const prompts = [
  "Create a browser game where a raccoon delivers pizza in space.",
  "Build a website for a haunted bed and breakfast.",
  "Create a cocktail recommendation quiz.",
  "Build a retro arcade game using HTML, CSS, and JavaScript.",
  "Create a music visualizer inspired by city lights.",
  "Build a virtual pet that lives in the browser.",
  "Create a personal website for a time traveler.",
  "Build a simple productivity app for creative teams.",
  "Create a website for a neighborhood cocktail bar with an event calendar and reservations.",
  "Build a game where players rescue cats from a space station."
];

const currentPrompt =
  prompts[Math.floor(Math.random() * prompts.length)];

document.getElementById("challenge").innerText =
  currentPrompt;

document
  .getElementById("openCodex")
  .addEventListener("click", () => {

    const url =
      `https://chat.openai.com/?q=${encodeURIComponent(currentPrompt)}`;

    window.location.href = url;

  });

</script>

</body>
</html>
